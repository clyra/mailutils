version: '3'
services:
  oauth2-proxy:
    build:
      context: .
      dockerfile: Dockerfile.oauth2-proxy
    image: oauth2-proxy
    container_name: oauth2-proxy
    restart: unless-stopped
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - TZ=America/Sao_Paulo
    ports:
      - 1993:1993
    volumes:
      - ./conf:/conf
    #entrypoint: [ 'sleep', '9000' ]

  imapfilter:
    build:
      context: .
      dockerfile: Dockerfile.imapfilter
    image: imapfilter
    container_name: imapfilter
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    environment:
      - TZ=America/Sao_Paulo
    volumes:
      - ./conf:/conf
    depends_on:
      - oauth2-proxy
    #entrypoint: [ 'sleep', '9000' ]

